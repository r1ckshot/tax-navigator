# Деплой колектора tg-assistant (S-1) на спільний VPS, урок 11.2.
#
# З 2026-10-01 тижневого циклу немає (DECISIONS): збір іде одноразовою командою
# `main.ts pull` за запитом Mike (research/tg-assistant/WEEKLY.md). Тож деплой
# лише збирає образ і гарантує, що жодного довгоживучого контейнера не лишилось.
# Нагляд після релізу (watch/drill) і черговий (tg-collector-oncall.yml) прибрані:
# дивитись нема на що. Код нагляду лишився в research/tg-assistant/observability/
# на випадок, якщо цикл повернеться (BACKLOG).
#
# Джоби з різними правами:
#   test   — GitHub-hosted, типи й тести воркера; без нього deploy не стартує.
#   deploy — self-hosted runner на VPS із ВЛАСНОЮ міткою `tax-navigator-vps`.
#            Голе `self-hosted` не годиться: на машині живе інший проєкт, і
#            чужий job приїхав би до нас, а наш — до нього.
#
# Секретів у GitHub цей workflow не потребує: runner уже на сервері, SSH-ключ і
# IP не потрібні. Секрети Telegram лежать у файлі на сервері, шлях до нього —
# змінна репо TG_ENV_FILE (шлях, не вміст).
#
# Репо публічне, тож pull_request сюди не додається ніколи: код із форка не
# має діставатися машини, де живе сусід.

name: deploy-tg-collector

on:
  push:
    branches: [master]
    paths:
      - 'research/tg-assistant/**'
      # Матриця їде в образ (S-3): нова редакція правил мусить дістатись розмітки.
      - 'app/lib/rules/rules.2026.json'
      - '.github/workflows/deploy-tg-collector.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tg-collector-vps
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install root toolchain (vitest, tsc)
        run: npm ci
      - name: Install worker dependencies
        run: npm ci --prefix research/tg-assistant
      - name: Typecheck
        run: npx tsc -p research/tg-assistant/tsconfig.json
      - name: Tests
        run: npx vitest run --config research/tg-assistant/vitest.config.ts

  deploy:
    needs: test
    runs-on: [self-hosted, linux, x64, tax-navigator-vps]
    timeout-minutes: 20
    env:
      COMPOSE: docker compose -f research/tg-assistant/compose.vps.yml
      TG_ENV_FILE: ${{ vars.TG_ENV_FILE }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to deploy without the server-side secrets file
        run: |
          test -n "$TG_ENV_FILE" || { echo "repo variable TG_ENV_FILE is not set"; exit 1; }
          test -r "$TG_ENV_FILE" || { echo "secrets file is not readable by the runner user"; exit 1; }

      - name: Build the image (project tax-navigator only)
        run: $COMPOSE --profile on-demand build

      - name: Remove the long-lived collector left by earlier releases
        # Нічого не піднімаємо: лише знімаємо контейнер, що крутив цикл. `rm`
        # торкається одного сервісу проєкту tax-navigator і не чіпає том зі станом
        # (жодного `down -v`) та сусіда.
        run: $COMPOSE --profile on-demand rm -sf tg-collector

      - name: Prove no cycle can start by itself
        run: |
          running=$(docker ps -q --filter label=com.docker.compose.project=tax-navigator --filter label=com.docker.compose.service=tg-collector)
          if [ -n "$running" ]; then echo "collector container is still running: $running"; exit 1; fi
          echo "no tg-collector container is running"

      - name: Smoke the on-demand image (one-shot, nothing is read from Telegram)
        # Без аргументів main.ts друкує usage і виходить 2: так видно, що в образі
        # є команда `pull`, не торкаючись мережі.
        run: |
          usage=$($COMPOSE --profile on-demand run --rm --no-deps tg-collector node main.ts 2>&1 || true)
          echo "$usage"
          echo "$usage" | grep -q 'pull --from DATE --to DATE'
          $COMPOSE --profile on-demand run --rm --no-deps tg-collector node -v

      - name: Show what is running
        if: always()
        run: docker ps --filter label=com.docker.compose.project=tax-navigator
